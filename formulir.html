<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Siswa</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-color: #ffffff;
        }

        .container {
            width: 500px;
            border-left: 1px solid #000;
            border-right: 1px solid #000;
            padding: 20px 40px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        hr {
            border: none;
            border-top: 1px solid #000;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 6px 0;
            vertical-align: top;
            font-size: 16px;
        }

        /* Kolom Label */
        td:nth-child(1) {
            width: 35%;
        }

        /* Kolom Titik Dua */
        td:nth-child(2) {
            width: 5%;
            text-align: center;
        }

        /* Kolom Input */
        td:nth-child(3) {
            width: 60%;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 3px 5px;
            border: 1px solid #767676;
            border-radius: 2px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .radio-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .checkbox-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .checkbox-container label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            resize: vertical;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .button-group input[type="submit"],
        .button-group input[type="reset"] {
            padding: 5px 20px;
            background-color: #e9e9e9;
            border: 1px solid #767676;
            border-radius: 2px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .button-group input[type="submit"]:hover,
        .button-group input[type="reset"]:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>FORM DATA SISWA</h2>
        <hr>

        <form action="" method="post">
            <table>
                <tr>
                    <td><label for="username">Username</label></td>
                    <td>:</td>
                    <td><input type="text" id="username" name="username"></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="password" name="password"></td>
                </tr>
                <tr>
                    <td><label for="nama">Nama Lengkap</label></td>
                    <td>:</td>
                    <td><input type="text" id="nama" name="nama"></td>
                </tr>
                <tr>
                    <td><label for="nohp">No. Handphone</label></td>
                    <td>:</td>
                    <td><input type="tel" id="nohp" name="nohp"></td>
                </tr>
                <tr>
                    <td><label for="email">E-Mail</label></td>
                    <td>:</td>
                    <td><input type="email" id="email" name="email"></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <div class="radio-container">
                            <label class="radio-group"><input type="radio" name="jk" value="Pria"> Pria</label>
                            <label class="radio-group"><input type="radio" name="jk" value="Wanita"> Wanita</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Hobi</td>
                    <td>:</td>
                    <td>
                        <div class="checkbox-container">
                            <label><input type="checkbox" name="hobi[]" value="Bermain game"> Menyanyi</label>
                            <label><input type="checkbox" name="hobi[]" value="Menggambar"> Menggambar</label>
                            <label><input type="checkbox" name="hobi[]" value="Menulis"> Membaca</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Kompetensi Keahlian</td>
                    <td>:</td>
                    <td>
                        <select name="kompetensi">
                            <option value="Rekayasa Perangkat Lunak">Rekayasa Perangkat Lunak</option>
                            <option value="Teknik Komputer dan Jaringan">Teknik Komputer dan Jaringan</option>
                            <option value="Multimedia">Multimedia</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="alamat">Alamat</label></td>
                    <td>:</td>
                    <td>
                        <textarea id="alamat" name="alamat" rows="5"></textarea>
                    </td>
                </tr>
            </table>

            <hr style="margin-top: 30px; margin-bottom: 20px;">

            <div class="button-group">
                <input type="submit" value="Kirim">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>

</body>
</html>
